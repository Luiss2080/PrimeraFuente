<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
  
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
      </marker>
  
      <g id="box">
        <rect width="120" height="120" rx="16" fill="#1A1D21" stroke="#2A2E33" stroke-width="2"/>
      </g>
  
      <style>
        .path-main { fill: none; stroke: #000000; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20 20; }
        .path-cycle { fill: none; stroke: #000000; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
        .path-data { fill: none; stroke: #000000; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18 18; }
        .path-accent { fill: none; stroke: #000000; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20 20; }
        .node { fill: #000000; filter: url(#glow); }
        .node-blue { fill: #000000; filter: url(#glow); }
        .node-core { fill: #000000; stroke: #000000; stroke-width: 2; }
        .letter-label { fill: #64748B; font-size: 12px; font-weight: 600; text-anchor: middle; letter-spacing: 1px; }
        .title { fill: #F8FAFC; font-size: 42px; font-weight: 300; text-anchor: middle; letter-spacing: 6px; }
        .subtitle { fill: #64748B; font-size: 14px; font-weight: 400; text-anchor: middle; letter-spacing: 2px; }
        .desc-title { fill: #E2E8F0; font-size: 14px; font-weight: 600; }
        .desc-text { fill: #64748B; font-size: 12px; font-weight: 400; }
</style>
  </defs>
  <g id="V" transform="translate(60,60) scale(1.4) translate(-60,-60)">
      <path class="path-main" d="M35 30 L60 90 L85 30" />
      <circle class="node-core" cx="60" cy="90" r="10" />
<circle class="node-core" cx="35" cy="30" r="10" />
      <circle class="node-core" cx="60" cy="90" r="10" />
      <circle class="node-core" cx="85" cy="30" r="10" />
      
    </g>
</svg>

